[workspace]
members = [
    "crates/detamu-core",
    "crates/detamu-engine",
    "crates/detamu-language",
    "crates/detamu-sdk",
    "crates/detamu-store",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EntasisLabs/detamu"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
detamu-core = { path = "crates/detamu-core" }
detamu-language = { path = "crates/detamu-language" }
detamu-store = { path = "crates/detamu-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

