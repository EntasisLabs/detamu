[workspace]
members = [
    "crates/detamu-core",
    "crates/detamu-engine",
    "crates/detamu-language",
    "crates/detamu-language-lizard",
    "crates/detamu-language-lsp",
    "crates/detamu-language-rust",
    "crates/detamu-language-tree-sitter",
    "crates/detamu-model",
    "crates/detamu-model-code",
    "crates/detamu-sdk",
    "crates/detamu-source-git",
    "crates/detamu-store",
    "crates/detamu-surreal",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EntasisLabs/detamu"
rust-version = "1.89"

[workspace.dependencies]
async-trait = "0.1"
detamu-core = { path = "crates/detamu-core" }
detamu-language = { path = "crates/detamu-language" }
detamu-language-lizard = { path = "crates/detamu-language-lizard" }
detamu-language-lsp = { path = "crates/detamu-language-lsp" }
detamu-language-rust = { path = "crates/detamu-language-rust" }
detamu-language-tree-sitter = { path = "crates/detamu-language-tree-sitter" }
detamu-model = { path = "crates/detamu-model" }
detamu-model-code = { path = "crates/detamu-model-code" }
detamu-source-git = { path = "crates/detamu-source-git" }
detamu-store = { path = "crates/detamu-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
surrealdb = { version = "3", default-features = false, features = ["kv-mem", "kv-surrealkv"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tree-sitter = "0.26.11"
tree-sitter-rust = "0.24.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
