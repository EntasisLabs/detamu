[workspace]
members = [
    "examples/index-and-query",
    "crates/detamu",
    "crates/detamu-core",
    "crates/detamu-code-coverage",
    "crates/detamu-engine",
    "crates/detamu-language",
    "crates/detamu-language-lizard",
    "crates/detamu-language-lsp",
    "crates/detamu-language-rust",
    "crates/detamu-language-rust-analyzer",
    "crates/detamu-language-tree-sitter",
    "crates/detamu-model",
    "crates/detamu-model-code",
    "crates/detamu-query",
    "crates/detamu-query-code",
    "crates/detamu-runtime",
    "crates/detamu-sdk",
    "crates/detamu-source-git",
    "crates/detamu-store",
    "crates/detamu-surreal",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
authors = ["Entasis Labs"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/EntasisLabs/detamu"
homepage = "https://github.com/EntasisLabs/detamu"
readme = "README.md"
keywords = ["analysis", "graph", "agents", "world-model"]
categories = ["development-tools", "data-structures"]
rust-version = "1.89"

[workspace.dependencies]
async-trait = "0.1"
detamu = { version = "0.1.1", path = "crates/detamu" }
detamu-code-coverage = { version = "0.1.1", path = "crates/detamu-code-coverage" }
detamu-core = { version = "0.1.1", path = "crates/detamu-core" }
detamu-language = { version = "0.1.1", path = "crates/detamu-language" }
detamu-language-lizard = { version = "0.1.1", path = "crates/detamu-language-lizard" }
detamu-language-lsp = { version = "0.1.1", path = "crates/detamu-language-lsp" }
detamu-language-rust = { version = "0.1.1", path = "crates/detamu-language-rust" }
detamu-language-rust-analyzer = { version = "0.1.1", path = "crates/detamu-language-rust-analyzer" }
detamu-language-tree-sitter = { version = "0.1.1", path = "crates/detamu-language-tree-sitter" }
detamu-model = { version = "0.1.1", path = "crates/detamu-model" }
detamu-model-code = { version = "0.1.1", path = "crates/detamu-model-code" }
detamu-query = { version = "0.1.1", path = "crates/detamu-query" }
detamu-query-code = { version = "0.1.1", path = "crates/detamu-query-code" }
detamu-runtime = { version = "0.1.1", path = "crates/detamu-runtime" }
detamu-sdk = { version = "0.1.1", path = "crates/detamu-sdk" }
detamu-source-git = { version = "0.1.1", path = "crates/detamu-source-git" }
detamu-store = { version = "0.1.1", path = "crates/detamu-store" }
detamu-surreal = { version = "0.1.1", path = "crates/detamu-surreal" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.41"
sha2 = "0.10"
surrealdb = { version = "3", default-features = false, features = ["kv-mem", "kv-surrealkv"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tree-sitter = "0.26.11"
tree-sitter-rust = "0.24.2"
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
