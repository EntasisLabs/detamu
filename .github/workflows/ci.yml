name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    # Same image as the Linux release build.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # git ships on ubuntu-24.04 and is required by detamu-source-git tests.
      # Lizard tests parse checked-in CSV fixtures and do not run the lizard binary.
      # The live rust-analyzer test prints a skip line and returns unless
      # DETAMU_RUST_ANALYZER is set, so this job does not install rust-analyzer.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Install script self-test
        run: DETAMU_SELF_TEST=1 bash scripts/install.sh
